server:
  listen: ":8443"
  secret_key: "change-me"
  keep_alive_interval_sec: 10
  max_idle_timeout_sec: 60

client:
  server_addr: "127.0.0.1:8443"
  secret_key: "change-me"
  keep_alive_interval_sec: 10
  max_idle_timeout_sec: 60
  reconnect_interval_sec: 2

routes:
  - local_port: 18080
    target: "127.0.0.1:19081"
    protocol: "tcp"
  - local_port: 15353
    target: "127.0.0.1:19082"
    protocol: "udp"
