client:
  server_addr: "127.0.0.1:4433"
  secret_key: "need-change"
  keep_alive_interval_sec: 10
  max_idle_timeout_sec: 60
  reconnect_interval_sec: 2

routes:
  - local_port: 4433
    target: "127.0.0.1:55901"
    protocol: "tcp"
  - local_port: 4433
    target: "127.0.0.1:55901"
    protocol: "udp"
